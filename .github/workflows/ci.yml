name: CI

on:
  pull_request:
  push:
    # Every branch, not just main. The node job's `npm run lint` is `tsc --noEmit`
    # against a fresh `actions/checkout`, which is the only check that sees a file
    # imported by committed code but never `git add`ed. Local runs compile against
    # the working copy, where the file is present, so they cannot catch it.
    branches: ['**']

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r apps/ml/requirements.txt
      - run: python -m unittest discover -s apps/ml -p "test_*.py" -v
