services:
  database-v2:
    image: pgvector/pgvector:pg16
    container_name: ai-quant-lab-db-v2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_quant_lab}
      POSTGRES_USER: ${POSTGRES_USER:-ai_quant_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-v2:
    image: aiquantlab-api-v2:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-quant-lab-api-v2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_quant_lab}:${POSTGRES_PASSWORD:-change_me}@database-v2:5432/${POSTGRES_DB:-ai_quant_lab}
      GIFT_NIFTY_YAHOO_SYMBOL: ${GIFT_NIFTY_YAHOO_SYMBOL:-}
      FII_DII_HISTORY_URL: ${FII_DII_HISTORY_URL:-}
      FYERS_APP_ID: ${FYERS_APP_ID:-}
      FYERS_APP_SECRET: ${FYERS_APP_SECRET:-}
      FYERS_PIN: ${FYERS_PIN:-}
      # Needed by `data:auth:fyers`, which is run inside this container when the refresh
      # token lapses. It was absent, so the one command that can restore Fyers access failed
      # on a missing variable rather than on anything to do with the credential.
      FYERS_REDIRECT_URI: ${FYERS_REDIRECT_URI:-}
      NSE_HOLIDAYS: ${NSE_HOLIDAYS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      API_MUTATION_RATE_LIMIT: ${API_MUTATION_RATE_LIMIT:-120}
    ports:
      - "127.0.0.1:4001:4000"
    # The readiness probe already exists as an endpoint; this is what makes dependants able to
    # wait for it. `scheduler-v2` in particular must not start before the API has migrated.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      database-v2:
        condition: service_healthy

  scheduler-v2:
    image: aiquantlab-api-v2:latest
    container_name: ai-quant-lab-scheduler-v2
    restart: unless-stopped
    # Reuses the api image and only overrides the command. Deliberately skips the
    # migrate-and-seed prelude in that image's CMD: the api service owns those, and
    # running them from two containers races on the same database.
    command: ["node", "apps/api/dist/interfaces/scheduler/scheduler.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_quant_lab}:${POSTGRES_PASSWORD:-change_me}@database-v2:5432/${POSTGRES_DB:-ai_quant_lab}
      GIFT_NIFTY_YAHOO_SYMBOL: ${GIFT_NIFTY_YAHOO_SYMBOL:-}
      FII_DII_HISTORY_URL: ${FII_DII_HISTORY_URL:-}
      FYERS_APP_ID: ${FYERS_APP_ID:-}
      FYERS_APP_SECRET: ${FYERS_APP_SECRET:-}
      FYERS_PIN: ${FYERS_PIN:-}
      FYERS_REDIRECT_URI: ${FYERS_REDIRECT_URI:-}
      NSE_HOLIDAYS: ${NSE_HOLIDAYS:-}
      # Keeps this process's own log lines on the bind mount below, where they survive the
      # container. Docker stores json-file logs under the container's directory and deletes them
      # with it, so `--force-recreate` destroys them -- and a skipped run writes nothing to
      # scheduled_job_runs by design, so that log is the only record a skip ever leaves. On
      # 2026-08-17 OPTION_CHAIN stopped claiming for 45 minutes and the container was recreated
      # before anyone read it, which made the cause unrecoverable.
      SCHEDULER_LOG_FILE: /app/logs/scheduler.log
    # Caps what Docker itself keeps, which is about disk rather than retention: rotation limits
    # size, it does not make a log outlive its container. SCHEDULER_LOG_FILE is what survives.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      # Diagnostic log lines that must outlive the container, per SCHEDULER_LOG_FILE above.
      - ./logs:/app/logs
      # Trained pickle artifacts must outlive the container: model_versions rows
      # reference them by absolute path, and the competition pool reloads them
      # for shadow predictions on every intraday run.
      #
      # A bind mount to the repository's own models/ directory, not a named volume.
      # A named volume outlives the container but is invisible to the host, and this
      # project trains from both: the host writes a Windows path under models/ while
      # the container wrote /app/models/... into a store the host could not see. The
      # two artifact stores diverged silently, and a host-run shadow-prediction pass
      # reported 'Could not read a valid pickle artifact' while skipping every
      # container-trained model. One shared directory removes the divergence;
      # resolve_artifact_path handles the differing path spellings.
      - ./models:/app/models
    depends_on:
      database-v2:
        condition: service_healthy
      # Waits for the API, because the API owns migrate-and-seed (see the command note above).
      # With only the database dependency, a cold start let the scheduler's first due minute
      # query tables that did not exist yet -- recorded as a FAILED job run rather than as the
      # startup ordering problem it was.
      api-v2:
        condition: service_healthy

  scalp-research-scheduler-v2:
    image: aiquantlab-api-v2:latest
    container_name: ai-quant-lab-scalp-research-scheduler-v2
    restart: unless-stopped
    profiles: ["research"]
    command: ["node", "apps/api/dist/interfaces/scheduler/scalp-research-scheduler.js"]
    environment:
      NODE_ENV: production
      # loadEnvironment requires DATABASE_URL, but the research process must not receive
      # operational credentials. This URL exists only for the username isolation check and
      # deliberately cannot connect; every query uses SCALP_RESEARCH_DATABASE_URL instead.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_quant_lab}:not_used@invalid/${POSTGRES_DB:-ai_quant_lab}
      SCALP_RESEARCH_DATABASE_URL: postgresql://${POSTGRES_RESEARCH_USER:-ai_quant_scalp_research}:${POSTGRES_RESEARCH_PASSWORD:-change_research_password}@database-v2:5432/${POSTGRES_DB:-ai_quant_lab}
      NSE_HOLIDAYS: ${NSE_HOLIDAYS:-}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      database-v2:
        condition: service_healthy
      api-v2:
        condition: service_healthy

  live-collector-v2:
    image: aiquantlab-api-v2:latest
    container_name: ai-quant-lab-live-collector-v2
    restart: unless-stopped
    # A daemon, not a scheduled job. It polls quotes and aggregates them into bars for the
    # whole session, so it cannot be a cron entry: the scheduler's overlap guard would see a
    # run that never ends and its abandonment horizon would write it off mid-session.
    #
    # `restart: unless-stopped` is what makes the timeframe usable. A window that opened
    # before the collector did is deliberately never started -- a partial bar sealed as
    # complete is worse than a missing one, because the gap self-heals through the historical
    # fetch and the fake does not -- so the cost of a late start is one lost bar per restart,
    # and the cost of not restarting is the rest of the session.
    #
    # Every timeframe the paper-trading bot scans, in one process.
    #
    # This was 15m only, on the reasoning that 1m's only strategy was momentum-scalp, which needs
    # VWAP, which needs volume the quotes endpoint does not report for an index. That reasoning
    # expired when `momentum-scalp-index` landed: it gates on Supertrend direction instead of VWAP,
    # so index 1m and 5m bars are now usable, and `trend-breakout` already supports 60m.
    #
    # Leaving it at 15m had made three quarters of the bot's scan surface dead. Measured 2026-08-11:
    # NIFTY50/BANKNIFTY 1m was four days stale, 5m and 60m five days, so a bot run skipped six of
    # eight symbol-timeframe pairs as STALE before any strategy was consulted.
    #
    # 30s polling is unchanged and is what bounds 1m accuracy: a 1m bar is aggregated from at most
    # two observations, so its high and low are the extremes of those samples rather than of the
    # minute. That is a known limit of quote-polled bars, not a defect introduced here.
    command:
      - "node"
      - "apps/api/dist/interfaces/cli/collect-live-market-data.js"
      - "--provider=fyers"
      - "--timeframe=1m,5m,15m,30m,60m"
      - "--instruments=NIFTY50,BANKNIFTY"
      - "--poll-seconds=30"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_quant_lab}:${POSTGRES_PASSWORD:-change_me}@database-v2:5432/${POSTGRES_DB:-ai_quant_lab}
      FYERS_APP_ID: ${FYERS_APP_ID:-}
      FYERS_APP_SECRET: ${FYERS_APP_SECRET:-}
      FYERS_PIN: ${FYERS_PIN:-}
      NSE_HOLIDAYS: ${NSE_HOLIDAYS:-}
    depends_on:
      database-v2:
        condition: service_healthy
      api-v2:
        condition: service_healthy

  live-collector-scalp-v2:
    image: aiquantlab-api-v2:latest
    container_name: ai-quant-lab-live-collector-scalp-v2
    restart: unless-stopped
    command:
      - "node"
      - "apps/api/dist/interfaces/cli/collect-live-market-data.js"
      - "--provider=fyers"
      # These exact 5m ETF bars are the volume source for index-option entry gates.
      # Keep 1m for scalp research while collecting both index proxies in the same poller.
      - "--timeframe=1m,5m"
      - "--instruments=NIFTYBEES,BANKBEES"
      - "--poll-seconds=15"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_quant_lab}:${POSTGRES_PASSWORD:-change_me}@database-v2:5432/${POSTGRES_DB:-ai_quant_lab}
      FYERS_APP_ID: ${FYERS_APP_ID:-}
      FYERS_APP_SECRET: ${FYERS_APP_SECRET:-}
      FYERS_PIN: ${FYERS_PIN:-}
      NSE_HOLIDAYS: ${NSE_HOLIDAYS:-}
    depends_on:
      database-v2:
        condition: service_healthy
      api-v2:
        condition: service_healthy

  depth-collector-v2:
    image: aiquantlab-api-v2:latest
    container_name: ai-quant-lab-depth-collector-v2
    restart: unless-stopped
    # Phase 28's raw L2 capture. A daemon for the same reason the other collectors are: it holds a
    # socket for the session, so the scheduler's overlap guard would write off a run that never ends.
    #
    # This is a FOURTH concurrent Fyers socket (scheduler + two collectors already hold one each).
    # A fourth was verified working live on 2026-08-21 while all three others were connected; the
    # actual per-app cap is unknown, so a connection-level error here is the first thing to check if
    # the other feeds start misbehaving after this service is enabled.
    #
    # ## Two known limitations, both deliberate rather than overlooked
    #
    # **The symbol is hardcoded and rolls.** This feed accepts a subscription to a dead contract and
    # then delivers nothing, with no error -- indistinguishable from a quiet book. Update this symbol
    # each expiry until front-month resolution is built.
    #
    # This happened, on schedule: BANKNIFTY26AUGFUT expired 2026-08-25 and capture went to zero from
    # the next session. The --stale-after-seconds guard fired correctly and was still not enough --
    # it logs to this container's stderr, and nothing polls a container's stderr, so two full sessions
    # of unbackfillable L2 were lost before a human noticed the row count had stopped moving. The
    # DEPTH_FRAME_STALENESS scheduler job now asks the same question from outside, against the table,
    # and a silence becomes a FAILED row in scheduled_job_runs visible at /api/v1/health/jobs.
    #
    # **There is no retention policy.** At the observed ~240 frames/minute/symbol, a full session is
    # roughly 90k rows per symbol per day. depth_frames is append-only with six numeric arrays per
    # row, so this grows materially faster than any other table here. Size it before letting it run
    # for weeks.
    command:
      - "node"
      - "apps/api/dist/interfaces/cli/collect-depth-frames.js"
      # No longer a hardcoded contract, and therefore no longer a scheduled manual edit. The
      # front month is resolved from option_expiry_calendar at every startup, so a roll costs a
      # container restart rather than someone remembering the date. Use --symbols to pin an exact
      # expiry for a one-off capture; passing both is refused.
      - "--underlying=BANKNIFTY"
      - "--levels=10"
      - "--flush-seconds=2"
      - "--progress-seconds=300"
      - "--stale-after-seconds=300"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_quant_lab}:${POSTGRES_PASSWORD:-change_me}@database-v2:5432/${POSTGRES_DB:-ai_quant_lab}
      FYERS_APP_ID: ${FYERS_APP_ID:-}
      FYERS_APP_SECRET: ${FYERS_APP_SECRET:-}
      FYERS_PIN: ${FYERS_PIN:-}
      NSE_HOLIDAYS: ${NSE_HOLIDAYS:-}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      database-v2:
        condition: service_healthy
      api-v2:
        condition: service_healthy

  web-v2:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Must be a build arg: Next.js bakes NEXT_PUBLIC_* into the client bundle,
        # so the environment entry below alone leaves the UI calling the v1 API.
        NEXT_PUBLIC_API_URL: http://localhost:4001/api/v1
    container_name: ai-quant-lab-web-v2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4001/api/v1
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      # Conditioned rather than a bare list entry, which only waits for the container to be
      # created and let the dashboard's first requests race the API's migration step.
      api-v2:
        condition: service_healthy

volumes:
  postgres-data-v2:
  # ml-models-v2 is intentionally gone: /app/models is now a bind mount to ./models so
  # host-trained and container-trained artifacts share one store. Its former contents
  # were copied into ./models before the switch, so no artifact was orphaned.
